name: Build OpenWrt for GL.iNet GL-MT300N V2 (Mango) [SPI-32MB_Mod]

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig file wget subversion
        sudo timedatectl set-timezone "Europe/Kyiv"

    - name: Clone OpenWrt Source
      run: |
        # Клонируем актуальную основную ветку разработки
        git clone -b main https://github.com/openwrt/openwrt.git openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        # Пробуем обновить фиды до двух раз в случае сетевой ошибки
        ./scripts/feeds update -a || ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply 32MB Flash Patch (DTS Modification)
      run: |
        cd openwrt
        # Ищем файл DTS автоматически по маске
        DTS_FILE=$(find target/linux -name "*gl-mt300n-v2*.dts" | head -n 1)
        if [ -n "$DTS_FILE" ] && [ -f "$DTS_FILE" ]; then
          echo "Found DTS file: $DTS_FILE"
          sed -i 's/reg = <0x0 0x1000000>;/reg = <0x0 0x2000000>;/g' "$DTS_FILE"
          echo "DTS successfully patched for 32MB flash!"
        else
          echo "Error: DTS file not found anywhere!"
          exit 1
        fi

    - name: Generate Correct Configuration for Mango (MT7628)
      run: |
        cd openwrt
        # Создаем чистый файл .config с правильными параметрами для Mango
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt7628=y" >> .config
        echo "CONFIG_TARGET_DEVICE_ramips_mt7628_DEVICE_gl-mt300n-v2=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        
        # Применяем конфигурацию
        make defconfig
        fi

    - name: Initialize Build Configuration
      run: |
        cd openwrt
        # make defconfig прочитает ваш .config и корректно применит настройки для Mango
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        make -j4 V=s

    - name: Organize Firmware Files
      id: organize
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: openwrt-mango-spi-32mb-fw
        path: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin