name: Build OpenWrt for GL.iNet GL-MT300N V2 (Mango) [SPI-32MB_Mod]

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Глобальные переменные для удобного управления версией и названием файлов
    env:
      OWRT_VERSION: "25.12.2"
      DEVICE_NAME: "glinet_gl-mt300n-v2"
      MOD_NAME: "spi32mod"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Удаляем лишнее ПО и устанавливаем все необходимые зависимости для сборки OpenWrt
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig file wget subversion
        sudo timedatectl set-timezone "Europe/Kyiv"

    - name: Clone OpenWrt Source
      run: |
        # Клонируем стабильную ветку OpenWrt 25.12 (с поддержкой apk)
        git clone -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        # Пробуем обновить фиды до двух раз на случай сетевых сбоев
        ./scripts/feeds update -a || ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply 32MB Flash Patch (DTS Modification)
      run: |
        cd openwrt
        # Ищем файл DTS автоматически по маске для GL-MT300N V2
        DTS_FILE=$(find target/linux -name "*gl-mt300n-v2*.dts" | head -n 1)
        if [ -n "$DTS_FILE" ] && [ -f "$DTS_FILE" ]; then
          echo "Found DTS file: $DTS_FILE"
          # 1. Увеличиваем общий размер чипа до 32MB (0x2000000)
          sed -i 's/reg = <0x0 0x1000000>;/reg = <0x0 0x2000000>;/g' "$DTS_FILE"
          # 2. Растягиваем раздел firmware на весь оставшийся объем 32MB чипа
          sed -i 's/reg = <0x50000 0xfb0000>;/reg = <0x50000 0x1fb0000>;/g' "$DTS_FILE"
          echo "DTS successfully patched for full 32MB flash storage!"
        else
          echo "Error: DTS file not found anywhere!"
          exit 1
        fi

    - name: Set Custom Hostname and LAN IP
      run: |
        cd openwrt
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-custom-settings
        #!/bin/sh
        uci set system.@system[0].hostname='Mango'
        uci set network.lan.ipaddr='192.168.8.1'
        uci commit system
        uci commit network
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-custom-settings

    - name: Generate Configuration
      run: |
        cd openwrt
        
        # Полностью формируем правильный конфигурационный файл с нуля
        cat << 'EOF' > .config
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt76x8=y
        CONFIG_TARGET_MULTI_PROFILE=n
        CONFIG_TARGET_DEVICE_ramips_mt76x8_DEVICE_glinet_gl-mt300n-v2=y
        
        # Интерфейс и системные настройки
        CONFIG_PACKAGE_luci=y
        
        # Пакеты для LTE-модемов и USB
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        CONFIG_PACKAGE_libmbim=y
        CONFIG_PACKAGE_picocom=y
        EOF
        
        # Запускаем генерацию. Система сама развернет зависимости для Mango
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        # Запускаем компиляцию прошивки, используя все доступные ядра процессора
        make -j$(nproc) V=s

    - name: Organize and Rename Firmware
      id: organize
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        # Находим исходный скомпилированный bin-файл
        SRC_FILE=$(ls *-sysupgrade.bin | head -n 1)
        
        # Формируем логичное имя из глобальных переменных env
        NEW_NAME="openwrt-${{ env.OWRT_VERSION }}-${{ env.DEVICE_NAME }}-${{ env.MOD_NAME }}-squashfs-sysupgrade.bin"
        
        # Переименовываем файл
        mv "$SRC_FILE" "$NEW_NAME"
        
        # Передаем переменные для шага загрузки артефакта
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "FIRMWARE_NAME=$NEW_NAME" >> $GITHUB_ENV

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        # Название ZIP-архива, который будет скачиваться из GitHub Actions
        name: openwrt-${{ env.OWRT_VERSION }}-${{ env.DEVICE_NAME }}-${{ env.MOD_NAME }}
        # Файл, который помещается внутрь архива
        path: ${{ env.FIRMWARE_PATH }}/${{ env.FIRMWARE_NAME }}