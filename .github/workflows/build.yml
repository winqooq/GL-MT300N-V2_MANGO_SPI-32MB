name: Build OpenWrt for GL.iNet GL-MT300N V2 (Mango) [SPI-32MB_Mod]
        # TEST bild v.X.X.X
        # Create code by Copilot
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OWRT_VERSION: "25.12.2"
      DEVICE_NAME: "glinet_gl-mt300n-v2"
      MOD_NAME: "spi32mod"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig file wget subversion
        sudo timedatectl set-timezone "Europe/Kyiv"

    - name: Clone OpenWrt Source
      run: |
        git clone -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a || ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply 32MB Flash Patch (DTS Modification)
      run: |
        cd openwrt
        DTS_FILE=$(find target/linux -name "*gl-mt300n-v2*.dts" | head -n 1)
        if [ -n "$DTS_FILE" ] && [ -f "$DTS_FILE" ]; then
          sed -i 's/reg = <0x0 0x1000000>;/reg = <0x0 0x2000000>;/g' "$DTS_FILE"
          sed -i 's/reg = <0x50000 0xfb0000>;/reg = <0x50000 0x1fb0000>;/g' "$DTS_FILE"
        else
          echo "Error: DTS file not found!"
          exit 1
        fi

    - name: Apply Custom Settings (IP, DHCP, Firewall)
      run: |
        cd openwrt
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-custom-settings
        #!/bin/sh
        # Hostname
        uci set system.@system[0].hostname='Mango'
        uci commit system

        # Bridge br-lan
        uci add network device
        uci set network.@device[-1].name='br-lan'
        uci set network.@device[-1].type='bridge'
        uci set network.@device[-1].ports='eth0'

        # LAN interface
        uci set network.lan.device='br-lan'
        uci set network.lan.proto='static'
        uci set network.lan.ipaddr='192.168.8.1'
        uci set network.lan.netmask='255.255.255.0'
        uci commit network

        # DHCP
        uci set dhcp.lan=dhcp
        uci set dhcp.lan.interface='lan'
        uci set dhcp.lan.start='100'
        uci set dhcp.lan.limit='150'
        uci set dhcp.lan.leasetime='12h'
        uci commit dhcp

        # Firewall zone LAN
        uci set firewall.@zone[0].name='lan'
        uci set firewall.@zone[0].network='lan'
        uci set firewall.@zone[0].input='ACCEPT'
        uci set firewall.@zone[0].output='ACCEPT'
        uci set firewall.@zone[0].forward='ACCEPT'
        uci commit firewall

        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-custom-settings

    - name: Generate Configuration
      run: |
        cd openwrt
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
        make defconfig
        sed -i 's/# CONFIG_TARGET_ramips_mt76x8_DEVICE_glinet_gl-mt300n-v2 is not set/CONFIG_TARGET_ramips_mt76x8_DEVICE_glinet_gl-mt300n-v2=y/g' .config

        # LuCI + modem support
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y" >> .config
        echo "CONFIG_PACKAGE_modemmanager=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-modemmanager=y" >> .config
        echo "CONFIG_PACKAGE_libmbim=y" >> .config
        echo "CONFIG_PACKAGE_picocom=y" >> .config

        # DHCP packages
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_odhcpd-ipv6only=y" >> .config

        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s

    - name: Organize and Rename Firmware
      id: organize
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        SRC_FILE=$(ls *-sysupgrade.bin | head -n 1)
        NEW_NAME="openwrt-${{ env.OWRT_VERSION }}-${{ env.DEVICE_NAME }}-${{ env.MOD_NAME }}-squashfs-sysupgrade.bin"
        mv "$SRC_FILE" "$NEW_NAME"
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "FIRMWARE_NAME=$NEW_NAME" >> $GITHUB_ENV

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: openwrt-${{ env.OWRT_VERSION }}-${{ env.DEVICE_NAME }}-${{ env.MOD_NAME }}
        path: ${{ env.FIRMWARE_PATH }}/${{ env.FIRMWARE_NAME }}
