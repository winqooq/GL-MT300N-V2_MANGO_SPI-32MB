name: Build OpenWrt for GL.iNet GL-MT300N V2 (Mango) [SPI-32MB_Mod]
        # TEST bild v.0.0.3
        # Create code by Gemini and winqooq
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    # Глобальные переменные для удобного управления версией и названием файлов
    env:
      OWRT_VERSION: "25.12.2"
      DEVICE_NAME: "glinet_gl-mt300n-v2"
      MOD_NAME: "SPI32Mod"
      MOD_TYPE: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Удаляем лишнее ПО и устанавливаем все необходимые зависимости для сборки OpenWrt
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig file wget subversion
          sudo timedatectl set-timezone "Europe/Kyiv"

      - name: Clone OpenWrt Source
        run: |
          # Клонируем стабильную ветку OpenWrt 25.12 (с поддержкой apk)
          git clone -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          # Пробуем обновить фиды до двух раз на случай сетевых сбоев
          ./scripts/feeds update -a || ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply 32MB Flash Patch (DTS Modification)
        run: |
          cd openwrt
          # Ищем файл DTS автоматически по маске для GL-MT300N V2
          DTS_FILE=$(find target/linux -name "*gl-mt300n-v2*.dts" | head -n 1)
          if [ -n "$DTS_FILE" ] && [ -f "$DTS_FILE" ]; then
            echo "Found DTS file: $DTS_FILE"
            # 1. Увеличиваем общий размер чипа до 32MB (0x2000000)
            sed -i 's/reg = <0x0 0x1000000>;/reg = <0x0 0x2000000>;/g' "$DTS_FILE"
            # 2. Растягиваем раздел firmware на весь оставшийся объем 32MB чипа
            sed -i 's/reg = <0x50000 0xfb0000>;/reg = <0x50000 0x1fb0000>;/g' "$DTS_FILE"
            echo "DTS successfully patched for full 32MB flash storage!"
          else
            echo "Error: DTS file not found!"
            exit 1
          fi
          # 2. Ищем и патчим Makefile для увеличения лимита генерации образа
          MK_FILE=$(find target/linux/ramips/image -name "mt76x8.mk" | head -n 1)
          if [ -n "$MK_FILE" ] && [ -f "$MK_FILE" ]; then
            echo "Found Makefile: $MK_FILE"
            # Ищем блок устройства и меняем IMAGE_SIZE на ~32MB (32768k минус размер u-boot)
            sed -i '/define Device\/glinet_gl-mt300n-v2/,/endef/ s/IMAGE_SIZE := .*/IMAGE_SIZE := 32448k/g' "$MK_FILE"
            echo "Makefile IMAGE_SIZE correctly increased to 32MB!"
          else
            echo "Error: mt76x8.mk file not found!"
            exit 1
          fi

      - name: Set Custom Hostname, LAN IP and Wi-Fi
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom-settings
          #!/bin/sh
          
          # Настраиваем hostname, LAN и включаем точку доступа Wi-Fi "Mango_2026" с паролем "Mango_2026"
          uci -q batch << EOI
          set system.@system[0].hostname='Mango'
          set network.lan.ipaddr='192.168.8.1/24'
          delete network.lan.netmask
          set wireless.@wifi-device[0].disabled='0'
          set wireless.@wifi-iface[0].disabled='0'
          set wireless.@wifi-iface[0].ssid='Mango_2026'
          set wireless.@wifi-iface[0].encryption='psk2'
          set wireless.@wifi-iface[0].key='Mango_2026'
          commit system
          commit network
          commit wireless
          EOI
          
          exit 0
          EOF
          
          # Согласно документации OpenWrt, скрипты uci-defaults не должны быть исполняемыми в папке files
          chmod -x files/etc/uci-defaults/99-custom-settings

      - name: Generate Configuration
        run: |
          cd openwrt
          
          # 1. Задаем базовый чипсет и генерируем заготовку конфигурации
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
          make defconfig

          # 2. Принудительно применим профиль роутера Mango
          sed -i 's/# CONFIG_TARGET_ramips_mt76x8_DEVICE_glinet_gl-mt300n-v2 is not set/CONFIG_TARGET_ramips_mt76x8_DEVICE_glinet_gl-mt300n-v2=y/g' .config

          # 3. Добавляем веб-интерфейс LuCI
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_luci=y
          # Базовые USB-драйверы ядра
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          
          # Драйверы для MBIM и RNDIS
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_usb-modeswitch=y
          
          # Полноценный стек ModemManager
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_libmbim=y
          CONFIG_PACKAGE_picocom=y
          EOF

          # 4. Финализируем конфигурацию с учетом добавленных пакетов
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          # Запускаем компиляцию прошивки, используя все доступные ядра процессора
          make -j$(nproc) V=s

      - name: Organize and Rename Firmware
        id: organize
        if: success()
        run: |
          cd openwrt/bin/targets/*/*
          # Находим исходный скомпилированный bin-файл
          SRC_FILE=$(ls *-sysupgrade.bin | head -n 1)
          
          # Формируем логичное имя из глобальных переменных env
          NEW_NAME="openwrt-${{ env.OWRT_VERSION }}-${{ env.DEVICE_NAME }}-${{ env.MOD_NAME }}-${{ env.MOD_TYPE }}-squashfs-sysupgrade.bin"
          
          # Переименовываем файл
          mv "$SRC_FILE" "$NEW_NAME"
          
          # Передаем переменные для шага загрузки артефакта
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "FIRMWARE_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          # Название ZIP-архива, который будет скачиваться из GitHub Actions
          name: openwrt-${{ env.OWRT_VERSION }}-${{ env.DEVICE_NAME }}-${{ env.MOD_NAME }}-${{ env.MOD_TYPE }}
          # Файл, который помещается внутрь архива
          path: ${{ env.FIRMWARE_PATH }}/${{ env.FIRMWARE_NAME }}-${{ env.MOD_TYPE }}